changelog:
  exclude:
    labels:
      - ignore-for-release
      - duplicate
      - question
  categories:
    - title: Breaking Changes
      labels:
        - Semver-Major
        - breaking-change
    - title: Features
      labels:
        - Semver-Minor
        - enhancement
        - feature
    - title: Fixes
      labels:
        - bug
        - fix
    - title: App and Packaging
      labels:
        - app
        - macos
        - packaging
        - release
    - title: Dependencies
      labels:
        - dependencies
    - title: Documentation
      labels:
        - documentation
        - docs
    - title: Other Changes
      labels:
        - "*"

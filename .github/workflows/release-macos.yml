name: Release macOS App

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build, for example v0.1.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  prepare-release:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release-tag.outputs.tag }}
    steps:
      - name: Resolve release tag
        id: release-tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            tag="${{ github.event.release.tag_name }}"
          else
            tag="${{ inputs.tag }}"
          fi

          if [ -z "$tag" ]; then
            echo "Release tag is required." >&2
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Create draft release for manual builds
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release-tag.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists."
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --generate-notes \
              --title "$RELEASE_TAG"
          fi

  build-macos:
    name: Build macOS ${{ matrix.arch }}
    needs: prepare-release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: amd64
            runner: macos-15-intel

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare-release.outputs.tag }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build and package app
        env:
          GOARCH: ${{ matrix.arch }}
        shell: bash
        run: make release-mac VERSION=${{ needs.prepare-release.outputs.tag }}

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
          ARCH: ${{ matrix.arch }}
        shell: bash
        run: |
          asset="build/release/Cursor-Tap-${RELEASE_TAG}-macos-${ARCH}.zip"
          gh release upload "$RELEASE_TAG" \
            "$asset" \
            "$asset.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: Cursor-Tap-${{ needs.prepare-release.outputs.tag }}-macos-${{ matrix.arch }}
          path: |
            build/release/*.zip
            build/release/*.sha256
